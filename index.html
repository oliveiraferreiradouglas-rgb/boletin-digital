<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - 8º Ano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho do boletim -->
  <header>
    <h1>Boletim Digital</h1>
    <p class="subtitulo">Estudante Exemplo — 8º Ano</p>
  </header>

  <main class="container">
    <!-- Cards de resumo na parte superior -->
    <section class="cards-grid">
      <div class="card">
        <h3>Média Geral</h3>
        <p id="media-geral" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Total de Faltas</h3>
        <p id="total-faltas" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Bom Desempenho</h3>
        <p id="bom-desempenho" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Precisa de Atenção</h3>
        <p id="precisa-atencao" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Frequência Geral</h3>
        <p id="frequencia-geral" class="valor-card">—</p>
        <span id="status-frequencia" class="subtexto-card"></span>
      </div>
    </section>

    <!-- Tabela responsiva de notas e faltas -->
    <section class="tabela-container">
      <table>
        <thead>
          <tr>
            <th>Disciplina</th>
            <th>1º Tri</th>
            <th>2º Tri</th>
            <th>3º Tri</th>
            <th>Média</th>
            <th>Faltas</th>
            <th>Situação</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela">
          <!-- As linhas das disciplinas serão preenchidas automaticamente pelo JavaScript -->
        </tbody>
      </table>
    </section>
  </main>

  <!-- Conexão com o script de lógica -->
  <script src="script.js"></script>
</body>
</html>
